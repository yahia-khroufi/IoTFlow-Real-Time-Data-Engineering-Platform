x-airflow-common: &airflow-common

  build:
    context: .
    dockerfile: ./airflows/dockerfile

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"

    # Keep the local development stack within Docker Desktop's memory budget.
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"

    # SparkSubmitOperator otherwise falls back to its default YARN master.
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type":"spark","host":"local[*]"}'

    PYTHONPATH: /opt/airflow/src

  env_file:
    - .env

  volumes:
    # DAGs Airflow
    - ./airflows/dags:/opt/airflow/dags

    # Logs Airflow
    - ./airflows/logs:/opt/airflow/logs

    # Plugins Airflow
    - ./airflows/plugins:/opt/airflow/plugins

    # Code PySpark
    - ./spark/src:/opt/airflow/src

    # Configuration imported by the Spark jobs
    - ./spark/configs:/opt/airflow/src/configs

    # Persistent files read/written by the local Spark jobs
    - ./data:/data

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    postgres:
      condition: service_healthy

  networks:
    - data-network


# =========================================================
# NETWORK
# =========================================================

networks:
  data-network:
    driver: bridge


services:

  # =======================================================
  # KAFKA
  # =======================================================

  kafka:
    image: apache/kafka:latest

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 1

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    networks:
      - data-network


  # =======================================================
  # NIFI
  # =======================================================

  nifi:
    image: apache/nifi:2.10.0
    container_name: nifi

    depends_on:
      - kafka

    ports:
      # NiFi HTTPS
      - "8443:8443"
      - "8082:8080"

    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME}

      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}

      NIFI_JVM_HEAP_INIT: 512m

      NIFI_JVM_HEAP_MAX: 1g

    volumes:
      # Fichiers rejetés
      - ./nifi/rejected:/rejected

    networks:
      - data-network


  # =======================================================
  # NIFI REGISTRY
  # =======================================================

  nifi-registry:
    image: apache/nifi-registry:latest
    container_name: nifi-registry

    ports:
      - "18080:18080"

    networks:
      - data-network


  # =======================================================
  # CASSANDRA
  # =======================================================

  cassandra:
    image: cassandra:5.0
    container_name: cassandra-node-1

    ports:
      - "9042:9042"

    environment:
      CASSANDRA_CLUSTER_NAME: iot-cluster

      CASSANDRA_DC: datacenter1

      CASSANDRA_RACK: rack1

      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch

      MAX_HEAP_SIZE: 1G

      HEAP_NEWSIZE: 200M

    volumes:
      # Données Cassandra persistantes
      - cassandra_data:/var/lib/cassandra

      # Script CQL
      - ./cassandra/init.cql:/init.cql

    networks:
      - data-network


  # =======================================================
  # EDGE AGENT
  # =======================================================

  edge-agent:
    build:
      context: .
      dockerfile: edge-agent/Dockerfile

    container_name: edge-agent

    env_file:
      - .env

    depends_on:
      - nifi

    volumes:
      # Logs de l'Edge Agent
      - ./logs:/app/logs

    networks:
      - data-network


  # =======================================================
  # POSTGRESQL
  # =======================================================

  postgres:
    image: postgres:13

    environment:
      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      # Données PostgreSQL persistantes
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]

      interval: 10s

      timeout: 5s

      retries: 5

    restart: always

    networks:
      - data-network


  # =======================================================
  # ADMINER
  # =======================================================

  adminer:
    image: adminer
    container_name: adminer

    ports:
      - "8081:8080"

    restart: always

    depends_on:
      - postgres

    networks:
      - data-network


  # =======================================================
  # AIRFLOW INIT
  # =======================================================

  airflow-init:
    <<: *airflow-common

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_NAME}" \
          --password "${AIRFLOW_PASSWORD}" \
          --firstname "${AIRFLOW_FIRSTNAME}" \
          --lastname "${AIRFLOW_LASTNAME}" \
          --role "${AIRFLOW_ROLE}" \
          --email "${AIRFLOW_EMAIL}" ||
        airflow users reset-password \
          --username "${AIRFLOW_NAME}" \
          --password "${AIRFLOW_PASSWORD}"

    user: "0:0"

    depends_on:
      postgres:
        condition: service_healthy


  # =======================================================
  # AIRFLOW WEBSERVER
  # =======================================================

  webserver:
    <<: *airflow-common

    command: webserver

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/health"
        ]

      interval: 30s

      timeout: 10s

      retries: 5

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: always


  # =======================================================
  # AIRFLOW SCHEDULER
  # =======================================================

  scheduler:
    <<: *airflow-common

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: always

  streamlit:
    build:
      context: .
      dockerfile: ./streamlit/Dockerfile
    container_name: streamlit-dashboard
    ports:
      - "8501:8501"
    environment:
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_KEYSPACE:  ${CASSANDRA_KEYSPACE}        
      CASSANDRA_TABLE:   ${TABLE1}
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    depends_on:
      - cassandra
    networks:
      - data-network 



volumes:

  postgres-db-volume:

  cassandra_data:
